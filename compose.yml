services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - ${WEB_PORT:-80}:80
    depends_on:
      - words

  words:
    build:
      context: ./words
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
